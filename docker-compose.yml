services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    image: python:3.10-slim
    working_dir: /app
    command: python -m http.server 5500 --bind 0.0.0.0
    volumes:
      - ./frontend:/app
    ports:
      - "5500:5500"
    depends_on:
      - backend
